name: Daily Shloka for Lost & Found Gods

on:
  schedule:
    # 9:17 AM India time; offset from the top of the hour to reduce queue delays.
    - cron: '47 3 * * *'
    # Backup at 10:17 AM India time; the receipt check makes this safe after a successful first run.
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish today's shloka now (leave unchecked to verify credentials only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-shloka-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_GRAPH_API_VERSION: v25.0
      SHLOKA_START_DATE: '2026-11-04'
    steps:
      - name: Check out the dedicated Instagram publisher
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rendering and API dependencies
        run: python -m pip install Pillow==11.3.0 requests==2.32.5

      - name: Select India-local verse and render card
        id: verse
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GODS_GEMINI_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          POST_DATE="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat())')"
          echo "date=$POST_DATE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.publish }}" != "true" ]]; then
            python build_daily_shloka.py --date "$POST_DATE" --preview-first
          else
            python build_daily_shloka.py --date "$POST_DATE"
          fi

      - name: Commit the public image for Meta to fetch
        if: github.event_name == 'schedule' || inputs.publish == true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_shlokas.json "media/daily-shlokas/${{ steps.verse.outputs.date }}"
          if ! git diff --cached --quiet; then
            git commit -m "Prepare daily shloka ${{ steps.verse.outputs.date }}"
            for attempt in 1 2 3 4; do
              if git push; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                exit 1
              fi
              sleep "$((attempt * 5))"
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
          fi

      - name: Publish the scheduled post
        if: github.event_name == 'schedule' || inputs.publish == true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python publish_daily_shloka.py --date "${{ steps.verse.outputs.date }}"

      - name: Verify credentials without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python publish_daily_shloka.py --date "${{ steps.verse.outputs.date }}" --preflight

      - name: Save a receipt to prevent duplicate daily posts
        if: success() && (github.event_name == 'schedule' || inputs.publish == true)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "published/${{ steps.verse.outputs.date }}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Record daily shloka publication ${{ steps.verse.outputs.date }}"
            for attempt in 1 2 3 4; do
              if git push; then
                break
              fi
              if [[ "$attempt" -eq 4 ]]; then
                exit 1
              fi
              sleep "$((attempt * 5))"
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
            done
          fi
